[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-mykasih"
version = "1.0.0"
description = "Agent-native CLI for MyKasih/SARA — semak kelayakan produk, kategori & kedai"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="mykasih-sara-research"}]
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
]
keywords = ["mykasih", "sara", "malaysia", "cli-anything"]

[project.urls]
Homepage = "https://app.mykasih.net"
Source = "https://github.com/mykasih-sara/cli-anything-mykasih"
Documentation = "https://github.com/mykasih-sara/cli-anything-mykasih/blob/main/cli_anything/mykasih/skills/SKILL.md"

[project.scripts]
cli-anything-mykasih = "cli_anything.mykasih.mykasih_cli:main"
mykasih = "cli_anything.mykasih.mykasih_cli:main"

[tool.setuptools.packages.find]
include = ["cli_anything*"]

[tool.setuptools.package-data]
"cli_anything.mykasih" = ["skills/*.md", "data/*.json", "data/*.csv"]
